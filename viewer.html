<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문서 보기 - Claude Code 학습 자료실</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f3ee;
      --paper: #fffdf9;
      --ink: #24201c;
      --muted: #6d655c;
      --line: #ded5ca;
      --accent: #bd5f3b;
      --accent-dark: #8f4126;
      --code-bg: #f3efe8;
      --shadow: 0 18px 45px rgba(74, 54, 37, 0.12);
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.75;
    }

    a {
      color: var(--accent-dark);
      text-decoration: none;
      font-weight: 700;
    }

    a:hover {
      text-decoration: underline;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(222, 213, 202, 0.9);
      background: rgba(247, 243, 238, 0.92);
      backdrop-filter: blur(14px);
    }

    .nav {
      max-width: 980px;
      min-height: 64px;
      margin: 0 auto;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-weight: 900;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #ffffff;
      background: var(--accent);
      font-size: 14px;
      font-weight: 900;
    }

    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: end;
    }

    .button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 800;
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 34px 22px 64px;
    }

    .doc-meta {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 14px;
      word-break: break-all;
    }

    .paper {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: clamp(24px, 5vw, 54px);
    }

    .markdown-body {
      overflow-wrap: anywhere;
    }

    .markdown-body > :first-child {
      margin-top: 0;
    }

    .markdown-body > :last-child {
      margin-bottom: 0;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      line-height: 1.28;
      letter-spacing: 0;
      margin: 1.7em 0 0.55em;
    }

    .markdown-body h1 {
      font-size: clamp(31px, 5vw, 48px);
      padding-bottom: 18px;
      border-bottom: 2px solid var(--line);
    }

    .markdown-body h2 {
      font-size: clamp(24px, 4vw, 34px);
      padding-bottom: 9px;
      border-bottom: 1px solid var(--line);
    }

    .markdown-body h3 {
      font-size: 22px;
    }

    .markdown-body h4 {
      font-size: 18px;
    }

    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body blockquote,
    .markdown-body table,
    .markdown-body pre {
      margin: 0 0 1.1em;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 1.45em;
    }

    .markdown-body li + li {
      margin-top: 0.25em;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--accent);
      color: var(--muted);
      background: #fbf4ed;
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
    }

    .markdown-body code {
      border-radius: 6px;
      background: var(--code-bg);
      padding: 0.15em 0.35em;
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 0.92em;
    }

    .markdown-body pre {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--code-bg);
      padding: 16px;
    }

    .markdown-body pre code {
      background: transparent;
      padding: 0;
      font-size: 0.9em;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      vertical-align: top;
    }

    .markdown-body th {
      background: #f2e9df;
      text-align: left;
    }

    .markdown-body img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    .state {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      padding: 18px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .nav {
        align-items: start;
        flex-direction: column;
      }

      .nav-actions {
        justify-content: start;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="nav" aria-label="문서 메뉴">
      <a class="brand" href="index.html">
        <span class="brand-mark">CC</span>
        <span>Claude Code 학습 자료실</span>
      </a>
      <div class="nav-actions">
        <a class="button" href="index.html">목록으로</a>
        <a class="button primary" id="rawLink" href="#">원본 Markdown</a>
      </div>
    </nav>
  </header>

  <main class="wrap">
    <div class="doc-meta" id="docMeta">문서를 불러오는 중이다.</div>
    <article class="paper">
      <div class="markdown-body" id="content">
        <div class="state">Markdown 문서를 불러오고 있다.</div>
      </div>
    </article>
  </main>

  <script src="docs-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script>
    const allowedFiles = new Set([
      "00-claude-cheat-sheet.md",
      "agent-teams-one-week.md",
      "claude-code-7-features-guide.md",
      "claude-code-agent-teams-guide.md",
      "claude-code-agent-teams-whiteboard-pattern.md",
      "claude-code-agent-workflow-principles-boris-cherny-claude.md",
      "claude-code-best-practices-official.md",
      "claude-code-boris-tips-13.md",
      "claude-code-codex-cross-check-flow.md",
      "claude-code-complete-setup-guide-2026.md",
      "claude-code-copy-export-guide.md",
      "claude-code-ecosystem-mcp-plugins-tools.md",
      "claude-code-hidden-commands-20-tips.md",
      "claude-code-hooks-guide.md",
      "claude-code-plugins-official-2026-03.md",
      "claude-code-review-subagent.md",
      "claude-code-sandbox-202604.md",
      "claude-code-sensitive-canary-security-plugin.md",
      "claude-code-skills-research-design-guide.md",
      "claude-code-skills-vs-subagents.md",
      "claude-code-spec-driven-feature-plan.md",
      "claude-code-tips-11.md",
      "claude-md-design-principles.md",
      "claude-md-guide.md",
      "claude-md-workflow-orchestration.md",
      "claude-skill-recommended.md",
      "claude_sandbox.md",
      "csharp-roslyn-language-server.md",
      "everything-claude-code-guide.md",
      "git_worktree.md",
      "hands-on-claudecode.md",
      "link.md",
      "poe_api_key.md",
      "README.md",
      "rules_output-compression.md",
      "use-openrouter.md"
    ]);

    const content = document.querySelector("#content");
    const docMeta = document.querySelector("#docMeta");
    const rawLink = document.querySelector("#rawLink");
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file") || "";

    function renderState(message) {
      content.innerHTML = `<div class="state">${message}</div>`;
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function basicMarkdownRender(markdown) {
      const lines = markdown.split(/\r?\n/);
      const html = [];
      let inCode = false;
      let codeLang = "";
      let paragraph = [];
      let listOpen = false;

      function flushParagraph() {
        if (!paragraph.length) {
          return;
        }
        html.push(`<p>${paragraph.join(" ")}</p>`);
        paragraph = [];
      }

      function closeList() {
        if (!listOpen) {
          return;
        }
        html.push("</ul>");
        listOpen = false;
      }

      for (const line of lines) {
        const fence = line.match(/^```(\S*)/);
        if (fence) {
          flushParagraph();
          closeList();
          if (!inCode) {
            inCode = true;
            codeLang = fence[1] || "";
            html.push(`<pre><code class="language-${escapeHtml(codeLang)}">`);
          } else {
            inCode = false;
            html.push("</code></pre>");
          }
          continue;
        }

        if (inCode) {
          html.push(`${escapeHtml(line)}\n`);
          continue;
        }

        if (!line.trim()) {
          flushParagraph();
          closeList();
          continue;
        }

        const heading = line.match(/^(#{1,4})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          closeList();
          html.push(`<h${heading[1].length}>${escapeHtml(heading[2])}</h${heading[1].length}>`);
          continue;
        }

        const item = line.match(/^\s*[-*]\s+(.+)$/);
        if (item) {
          flushParagraph();
          if (!listOpen) {
            html.push("<ul>");
            listOpen = true;
          }
          html.push(`<li>${escapeHtml(item[1])}</li>`);
          continue;
        }

        paragraph.push(escapeHtml(line));
      }

      flushParagraph();
      closeList();
      if (inCode) {
        html.push("</code></pre>");
      }
      return html.join("\n");
    }

    async function getMarkdown(targetFile) {
      const embedded = window.CLAUDE_DOCS && Object.prototype.hasOwnProperty.call(window.CLAUDE_DOCS, targetFile);

      if (window.location.protocol === "file:" && embedded) {
        return {
          markdown: window.CLAUDE_DOCS[targetFile],
          source: "내장 문서 데이터"
        };
      }

      try {
        const response = await fetch(targetFile);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        return {
          markdown: await response.text(),
          source: "Markdown 파일"
        };
      } catch (error) {
        if (embedded) {
          return {
            markdown: window.CLAUDE_DOCS[targetFile],
            source: "내장 문서 데이터"
          };
        }
        throw error;
      }
    }

    function renderMarkdown(markdown) {
      if (window.marked && window.DOMPurify) {
        const html = marked.parse(markdown, {
          gfm: true,
          breaks: false
        });
        return DOMPurify.sanitize(html, {
          ADD_ATTR: ["target", "rel"]
        });
      }

      return basicMarkdownRender(markdown);
    }

    function rewriteMarkdownLinks(root) {
      root.querySelectorAll("a[href$='.md']").forEach((link) => {
        const href = link.getAttribute("href");
        if (!href || href.includes("://") || href.startsWith("#")) {
          return;
        }

        const target = href.split("#")[0];
        const hash = href.includes("#") ? `#${href.split("#").slice(1).join("#")}` : "";
        if (allowedFiles.has(target)) {
          link.setAttribute("href", `viewer.html?file=${encodeURIComponent(target)}${hash}`);
        }
      });
    }

    async function loadDocument() {
      if (!allowedFiles.has(file)) {
        document.title = "문서를 찾을 수 없다 - Claude Code 학습 자료실";
        docMeta.textContent = "허용된 문서 파일이 아니다.";
        renderState("문서 이름이 없거나 허용된 목록에 없는 파일이다. 목록으로 돌아가 다시 선택한다.");
        rawLink.removeAttribute("href");
        return;
      }

      rawLink.href = file;
      docMeta.textContent = file;

      try {
        const result = await getMarkdown(file);
        content.innerHTML = renderMarkdown(result.markdown);
        docMeta.textContent = `${file} · ${result.source}`;
        rewriteMarkdownLinks(content);

        const firstHeading = content.querySelector("h1, h2");
        if (firstHeading) {
          document.title = `${firstHeading.textContent.trim()} - Claude Code 학습 자료실`;
        }

        if (window.hljs) {
          content.querySelectorAll("pre code").forEach((block) => {
            hljs.highlightElement(block);
          });
        }
      } catch (error) {
        document.title = "문서 로딩 실패 - Claude Code 학습 자료실";
        docMeta.textContent = file;
        renderState("문서를 불러오지 못했다. docs-data.js가 함께 배포되어 있는지 확인한다.");
      }
    }

    loadDocument();
  </script>
</body>
</html>
