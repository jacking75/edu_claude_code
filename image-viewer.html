<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인포그래픽 보기 - Claude Code 학습 자료실</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg: #171310;
      --panel: rgba(23, 19, 16, 0.88);
      --text: #fff8ef;
      --muted: #c9bcae;
      --line: rgba(255, 248, 239, 0.18);
      --accent: #bd5f3b;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      overflow: hidden;
    }

    .topbar {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(12px);
    }

    .title {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: end;
      gap: 8px;
    }

    a {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 12px;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.06);
    }

    a.primary {
      border-color: var(--accent);
      background: var(--accent);
    }

    .stage {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      background: #ffffff;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
    }

    @media (max-width: 640px) {
      body {
        grid-template-rows: auto minmax(0, 1fr);
      }

      .topbar {
        align-items: start;
        flex-direction: column;
      }

      .actions {
        justify-content: start;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title">
      <h1>Claude Code 인포그래픽</h1>
      <div class="hint">브라우저 창 크기에 맞춰 표시된다.</div>
    </div>
    <div class="actions">
      <a href="index.html">목록으로</a>
      <a class="primary" href="infographics/001.jpg" target="_blank" rel="noopener">원본 열기</a>
    </div>
  </header>
  <main class="stage">
    <img src="infographics/001.jpg" alt="Claude Code API 할당량 소진 시 로컬 모델로 계속 작업하는 방법 인포그래픽" />
  </main>
</body>
</html>
